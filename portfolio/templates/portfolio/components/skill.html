<section class="section" id="service">
        <div class="container text-center">
            <p class="section-subtitle">What do I know?</p>
            <h6 class="section-title mb-6">Skill</h6>
            <!-- row -->
            <div class="row" >
                            {% for skill in skills %}
            <div class="col-md-6 col-lg-3"  style="margin-top:20px">
                <div class="service-card">
                    <div class="body">
                        {% if skill.image %}
                        <img src="{{ skill.image.url }}" alt="{{ skill.title }}" class="icon" style="width: 67px; height: 67px;">
                        {% endif %}
                        <h6 class="title">{{ skill.title }}</h6>

                        <!-- Progress bar -->
                <div class="progress-container">
                 <div class="progress-bar" style="width: {{ skill.progress }}%;"></div>
                    <span class="progress-text">{{ skill.progress }}%</span>
                    </div>
                   </div>
                </div>
            </div>
            {% endfor %}
            </div><!-- end of row -->
        </div>
    </section><!-- end of service section -->
