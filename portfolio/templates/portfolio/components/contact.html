<section class="section" id="contact">
        <div class="container text-center">
            <p class="section-subtitle">How can you communicate?</p>
            <h6 class="section-title mb-5">Contact Me</h6>
            <!-- contact form -->
            {% if form.errors %}
            <div class="alert alert-danger col-md-10 col-lg-8 m-auto mb-4">
                {% for field in form %}{% for error in field.errors %}<div>{{ field.label }}: {{ error }}</div>{% endfor %}{% endfor %}
            </div>
            {% endif %}
    <form action="{% url 'index' %}" method="post" class="contact-form col-md-10 col-lg-8 m-auto">
    {% csrf_token %}
    <div class="form-row">
        <div class="form-group col-sm-6">
            <input type="text" name="name" maxlength="255" value="{{ form.name.value|default:'' }}" class="form-control" placeholder="Your Name" required>
        </div>
        <div class="form-group col-sm-6">
            <input type="email" name="email" value="{{ form.email.value|default:'' }}" class="form-control" placeholder="Enter Email" required>
        </div>
        <div class="form-group col-sm-12">
            <textarea name="message" id="message" rows="6" class="form-control" placeholder="Write Something" required>{{ form.message.value|default:'' }}</textarea>
        </div>
        <div class="form-group col-sm-12 mt-3">
            <input type="submit" value="Send Message" class="btn btn-outline-primary rounded">
        </div>
    </div>
</form>
        </div>
    </section>
