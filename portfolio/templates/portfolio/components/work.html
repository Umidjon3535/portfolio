<section class="section" id="portfolio">
        <div class="container text-center">
            <p class="section-subtitle">What I Did ?</p>
            <h6 class="section-title mb-6">Work</h6>
            <!-- row -->
            <div class="row">
                {% for work in works %}
                <div class="col-md-4">
                    <a href="{{ work.link|default:'#portfolio' }}" class="portfolio-card"{% if work.link %} target="_blank" rel="noopener"{% endif %}>
                        {% if work.image %}
                        <img src="{{ work.image.url }}" class="portfolio-card-img"
                            alt="{{ work.title }}">
                        {% endif %}
                        <span class="portfolio-card-overlay">
                            <span class="portfolio-card-caption">
                                <h4>{{work.title}}</h4>
                                    <span class="font-weight-normal btn btn-danger">Live Demo</span>
                            </span>
                        </span>
                    </a>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>
